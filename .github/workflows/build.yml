name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extrair ZIP e Compilar
      run: |
        unzip -q *.zip -d projeto_extraido
        cd $(dirname $(find projeto_extraido -name build.gradle.kts | head -n 1))
        gradle assembleDebug

    - name: Disponibilizar o APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: app-pdv-pronto
        path: '**/*.apk'
