name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extrair ZIP, Corrigir e Compilar
      run: |
        unzip -q *.zip -d projeto_extraido
        
        # Vai direto para a pasta principal VERDADEIRA do projeto
        cd $(dirname $(find projeto_extraido -name "settings.gradle*" | head -n 1))
        
        # Forçar os processos internos do Kotlin a rodarem sem interface gráfica
        echo "org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true" > gradle.properties
        export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
        
        # 1. Criar a assinatura digital
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # 2. Descobrir o nome do pacote e criar o arquivo do Google
        mkdir -p app
        APP_ID=$(grep "applicationId" app/build.gradle* 2>/dev/null | grep -o '"[^"]*"' | tr -d '"' | head -n 1)
        if [ -z "$APP_ID" ]; then
          APP_ID="com.example.app"
        fi
        
        echo '{
          "project_info": { "project_number": "123", "project_id": "dummy-pdv" },
          "client": [ {
            "client_info": {
              "mobilesdk_app_id": "1:123:android:456",
              "android_client_info": { "package_name": "'"$APP_ID"'" }
            },
            "api_key": [ { "current_key": "dummy-key" } ]
          } ],
          "configuration_version": "1"
        }' > app/google-services.json
        
        # 3. Injetar a permissão de câmera no AndroidManifest.xml
        MANIFEST_PATH=$(find . -name "AndroidManifest.xml" | head -n 1)
        if [ -f "$MANIFEST_PATH" ]; then
          if ! grep -q "android.permission.CAMERA" "$MANIFEST_PATH"; then
            sed -i 's/<manifest /<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android" /g' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-feature android:name="android.hardware.camera" android:required="false" \/>' "$MANIFEST_PATH"
          fi
        fi

        # 4. Injetar as dependências do CameraX e ML Kit no build.gradle do app se já não existirem
        APP_GRADLE=$(find . -path "*/app/build.gradle*" | head -n 1)
        if [ -f "$APP_GRADLE" ]; then
          if ! grep -q "androidx.camera:camera-camera2" "$APP_GRADLE"; then
            echo -e "\ndependencies {\n    implementation 'androidx.camera:camera-camera2:1.3.1'\n    implementation 'androidx.camera:camera-lifecycle:1.3.1'\n    implementation 'androidx.camera:camera-view:1.3.1'\n    implementation 'com.google.mlkit:barcode-scanning:17.2.0'\n}" >> "$APP_GRADLE"
          fi
        fi
        
        # 5. Ordem final de compilação
        gradle assembleDebug --no-daemon

    - name: Disponibilizar o APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: app-pdv-pronto
        path: '**/*.apk'
