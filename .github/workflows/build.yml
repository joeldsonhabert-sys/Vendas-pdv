name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Encontrar pasta do projeto e Compilar APK
      run: |
        # Acha onde está o arquivo de configuração do projeto automaticamente
        PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        cd "$PROJECT_DIR"
        
        echo "org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true" > gradle.properties
        gradle assembleDebug --no-daemon

    - name: Disponibilizar o APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: app-pdv-pronto
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
